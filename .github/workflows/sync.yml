name: Sync from Notion and deploy

on:
  schedule:
    # After each bot shift: 8:30, 10:30, 16:30, 18:30 ET (EDT = UTC-4).
    # Shift these by +1 hour when clocks fall back to EST.
    - cron: '30 12,14,20,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Queue Pages deploys; never let an older run overwrite a newer tip of main.
# (cancel-in-progress: false avoids killing a deploy mid-flight; the tip check
# below skips stale runs that finish late — that was overwriting Career Track.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5+ run on Node 24 (clears the Node 20 deprecation annotation).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm ci when a lockfile is committed, plain install otherwise.
      - run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Pull Apply log from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '2909dfcb-954c-482f-ad12-b1bc752572ea' }}
          PRIVATE_PASSPHRASE: ${{ secrets.PRIVATE_PASSPHRASE }}
        run: npm run sync

      - name: Build site
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      # v5 pulls upload-artifact on Node 24 (clears the Node 20 annotation).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip deploy if this run is not tip of main
        id: tip
        run: |
          git fetch origin main --depth=1
          tip=$(git rev-parse origin/main)
          echo "tip=${tip}"
          echo "this=${GITHUB_SHA}"
          if [ "${GITHUB_SHA}" != "${tip}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deploy: ${GITHUB_SHA} is behind tip ${tip}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        if: steps.tip.outputs.skip != 'true'
        uses: actions/deploy-pages@v5
